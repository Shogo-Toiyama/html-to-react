<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex Kim | Portfolio</title>
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body class="light">
  <!-- Navigation -->
  <header class="site-header">
    <a href="#" class="logo">Alex<span>.</span></a>
    <nav id="nav-links">
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
      <a href="about.html">More about me</a>
    </nav>
    <button class="menu-button" onclick="toggleMenu()" aria-label="Open menu">&#9776;</button>
    <button id="theme-toggle" tabindex="0">🌙 Dark mode</button>
  </header>

  <section id="hero" style="background-image: url('images/bg.png'); --accent: #fe8d3c; padding-top: 40px">
    <img src="images/profile.png" alt="Photo of Alex" class="profile" width="120">
    <h1>Hi, I'm <span id="typed"></span></h1>
    <p>I build <strong>websites</strong> &amp; <em>small games</em>. My favorite symbol is {curly braces}.</p>
    <button onclick="celebrate()">Click me!</button>
  </section>

  <section id="about">
    <h2>About me</h2>
    <p>
      I'm a second-year student
      who loves design.<br>
      Based in Los Angeles.
    </p>
    <svg width="24" height="24" viewBox="0 0 24 24" class="icon">
      <circle cx="12" cy="12" r="10" stroke="#fe8d3c" stroke-width="2" fill="none"></circle>
    </svg>
  </section>

  <hr>

  <section id="projects">
    <h2>Projects</h2>
    <ul id="project-list"></ul>
    <p id="project-count"></p>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <form id="contact-form" onsubmit="return handleSubmit(event)">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" value="Your name" maxlength="40" required>
      <label><input type="checkbox" id="subscribe" checked> Subscribe</label>
      <select id="topic">
        <option value="hello">Say hello</option>
        <option value="work" selected>Work together</option>
      </select>
      <textarea id="message" rows="4">Hi Alex,</textarea>
      <button type="submit">Send</button>
    </form>
    <p id="form-result"></p>
  </section>

  <footer>
    <p>&copy; 2026 Alex Kim · <a href="javascript:void(0)" onclick="scrollToTop()">Back to top</a></p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
